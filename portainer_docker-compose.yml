# File: portainer_docker-compose.yml
# Purpose: Docker Compose configuration tailored for deployment via Portainer Stacks.
#          *** Requires ABSOLUTE paths for volumes on the host machine! ***

services:
  findmyapp:
    # Use the image you built and pushed OR one available on Docker Hub
    image: ghd182/findmy-webapp:latest
    container_name: findmyapp
    restart: unless-stopped
    ports:
      # HostPort:ContainerPort
      - "5000:5000"
    volumes:
      # --- CRITICAL: Use ABSOLUTE HOST PATHS below ---
      # Replace '/path/on/your/host' with the actual full path to your project's data directory.
      # Example Linux: /home/pi/findmy-app/data:/app/data
      # Example Windows (using WSL paths or Docker Desktop volume mapping): /mnt/c/Users/YourUser/findmy-app/data:/app/data or mapped volume name
      - /path/on/your/host/data:/app/data 
      # Optional: Mount .env if needed (USE ABSOLUTE PATH)
      # - /path/on/your/host/.env:/app/.env 
    environment:
      # --- Core Flask/App Settings ---
      FLASK_ENV: production
      LOG_LEVEL: INFO
      # Set your timezone
      TZ: Europe/Amsterdam
      WAITRESS_THREADS: 8

      # --- SEED Variables (CRITICAL: Set strong, unique secrets!) ---
      # These seeds generate the actual keys used by the application. Keep them secret!
      # For Flask session signing
      SECRET_SEED: "your-very-long-random-secret-phrase-for-sessions-portainer"
      # For encrypting sensitive data
      FERNET_SEED: "another-different-long-random-secret-phrase-for-encryption-portainer"
      # For Web Push VAPID keys
      VAPID_SEED: "a-third-unique-long-random-phrase-for-push-keys-portainer"
      # REQUIRED for VAPID - set your contact email
      VAPID_CLAIMS_EMAIL: "mailto:you@example.com"

      # --- Anisette Server Configuration ---
      # Points to the anisette service defined below (internal Docker network name)
      ANISETTE_SERVERS: "http://anisette:6969"

      # --- Application Behaviour Configuration (Overrides) ---
      DEFAULT_FETCH_INTERVAL_MINUTES: 30
      FETCH_INTERVAL_MINUTES: 15
      LOW_BATTERY_THRESHOLD: 40
      NOTIFICATION_COOLDOWN_SECONDS: 600
      NOTIFICATION_HISTORY_DAYS: 60
      HISTORY_DURATION_DAYS: 14
      # Default 5 mins for Android config endpoint
      NATIVE_SCAN_INTERVAL_SECONDS: 300

    depends_on:
      - anisette

  # --- Anisette Server Service ---
  anisette:
    image: dadoum/anisette-v3-server:latest # Official image
    container_name: anisette-server
    restart: unless-stopped
    # No external ports needed. Communication is internal via service name 'anisette'.
    # No volumes needed.
    # No environment variables needed.