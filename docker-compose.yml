# File: docker-compose.yml
# Purpose: Define services for local development/testing using Docker Compose.

services:
  findmyapp:
    # Build the image using the Dockerfile in the current directory (Flask WebApp)
    build:
      context: .
      dockerfile: Dockerfile
    # Optional: Specify target platform if needed (e.g., for Apple Silicon or Raspberry Pi)
    # platform: linux/arm64/v8
    # Optional: Use a pre-built image name
    image: ghd182/findmy-webapp:latest
    container_name: findmyapp
    restart: unless-stopped
    ports:
      # Map host port 5000 to container port 5000
      # Change host port (left side) if 5000 is occupied on your system
      - "5000:5000"
    volumes:
      # Mount local ./data directory for persistent storage (DB, user files, cache)
      # CRITICAL: Ensure this directory exists and has correct permissions on the host.
      - ./data:/app/data
      # Optional: Mount .env file for development overrides (less common now with seeds)
      # - ./.env:/app/.env
    environment:
      # --- Core Flask/App Settings ---
      # Set to 'development' for debugging
      FLASK_ENV: production
      # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
      LOG_LEVEL: INFO
      # Set to your local timezone (e.g., America/New_York)
      TZ: Europe/Amsterdam
      # Adjust based on server resources
      WAITRESS_THREADS: 8

      # --- SEED Variables (CRITICAL: Set strong, unique secrets!) ---
      # These seeds generate the actual keys used by the application. Keep them secret!
      # Use long, random phrases. Don't commit real secrets here in public repos.
      # For Flask session signing
      SECRET_SEED: "your-very-long-random-secret-phrase-for-sessions"
      # For encrypting sensitive data (e.g., Apple password)
      FERNET_SEED: "another-different-long-random-secret-phrase-for-encryption"
      # For Web Push VAPID keys
      VAPID_SEED: "a-third-unique-long-random-phrase-for-push-keys"
      # REQUIRED for VAPID - set your contact email
      VAPID_CLAIMS_EMAIL: "mailto:you@example.com"

      # --- Anisette Server Configuration ---
      # Points to the anisette service defined below within the Docker network
      ANISETTE_SERVERS: "http://anisette:6969"

      # --- Application Behaviour Configuration (Overrides) ---
      # Default background fetch interval
      DEFAULT_FETCH_INTERVAL_MINUTES: 30
      # Actual interval used (can override default)
      FETCH_INTERVAL_MINUTES: 15
      # Battery level % for low battery alerts
      LOW_BATTERY_THRESHOLD: 40
      # Min seconds between same alert type (10 mins)
      NOTIFICATION_COOLDOWN_SECONDS: 600
      # How long to keep notification history
      NOTIFICATION_HISTORY_DAYS: 60
      # How many days of location history to fetch/display
      HISTORY_DURATION_DAYS: 14

      # Native Scanner Scan Interval (Affects config sent TO Android app)
      # Default 5 minutes (Android app should ideally poll config endpoint)
      NATIVE_SCAN_INTERVAL_SECONDS: 300

    depends_on:
      # Ensure anisette server starts before the web app attempts to use it
      - anisette

  # --- Anisette Server Service ---
  anisette:
    # Official Anisette server image
    image: dadoum/anisette-v3-server:latest
    container_name: anisette-server
    restart: unless-stopped
    # No ports exposed externally by default
    # No volumes needed for basic operation
    # No environment variables needed for basic operation
    # platform: linux/arm64/v8 # Usually not needed, image is multi-arch